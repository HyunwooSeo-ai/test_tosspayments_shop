<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 | NINE STORE</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
  <header id="header"></header>

  <main class="auth">
    <h1 class="auth__title">로그인</h1>
    <form id="authForm" novalidate>
      <div class="auth__field"><label for="email">이메일</label><input id="email" type="email" autocomplete="email" required></div>
      <div class="auth__field"><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required></div>
      <p class="hint" id="hint"></p>
      <button type="submit" class="btn btn--primary btn--block">로그인</button>
    </form>
    <div class="auth__links">
      <a href="reset.html">비밀번호 찾기</a>
      <a href="signup.html" id="altLink">회원가입</a>
    </div>
  </main>

  <footer id="footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/products.js"></script>
  <script src="js/common.js"></script>
  <script src="js/chatbot.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
