<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>비밀번호 재설정 | NINE STORE</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="reset">
  <header id="header"></header>

  <main class="auth">
    <h1 class="auth__title">비밀번호 재설정</h1>
    <form id="requestForm" novalidate>
      <p class="auth__desc">가입한 이메일을 입력하시면 비밀번호 재설정 링크를 보내 드립니다.</p>
      <div class="auth__field"><label for="email">이메일</label><input id="email" type="email" autocomplete="email" required></div>
      <p class="hint" id="hint"></p>
      <button type="submit" class="btn btn--primary btn--block">재설정 메일 보내기</button>
    </form>
    <form id="updateForm" novalidate hidden>
      <p class="auth__desc">새 비밀번호를 입력해 주세요.</p>
      <div class="auth__field"><label for="password">새 비밀번호</label><input id="password" type="password" autocomplete="new-password" placeholder="8자 이상" required></div>
      <div class="auth__field"><label for="password2">새 비밀번호 확인</label><input id="password2" type="password" autocomplete="new-password" required></div>
      <p class="hint" id="hint2"></p>
      <button type="submit" class="btn btn--primary btn--block">비밀번호 변경</button>
    </form>
    <div class="auth__links"><a href="login.html">로그인으로 돌아가기</a></div>
  </main>

  <footer id="footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/products.js"></script>
  <script src="js/common.js"></script>
  <script src="js/chatbot.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
